# Governing: SPEC-0007 REQ "Local Development", REQ "Configuration Keys"; ADR-0004 (no deployment values here)
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  pocketbase:
    name: PocketBase smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Download pinned PocketBase (checksum verified)
        run: |
          cp .env.example .env
          npm run pb:download
      - name: Boot throwaway PocketBase and probe health
        run: npm run smoke
      - name: Access rules and seed tests against throwaway PocketBase
        run: npm run test:rules
